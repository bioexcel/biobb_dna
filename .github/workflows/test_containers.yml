name: tests containers

on:
  # workflow_dispatch
  push:
    branches: [ master ]
    paths-ignore:
      - '.gitignore'
      - '.readthedocs.yaml'
      - 'LICENSE'
      - 'setup.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'references.jsonld'
      - '**/docs/**'
      - '**/json_schemas/**'
      - '.github/workflows/pr-tests.yml'
      - '**/test/data/**'
      - '**/test/references/**'
      - '.github/workflows/linting_and_testing.yml'

jobs:
  test_containers:
    uses: bioexcel/biobb/.github/workflows/test_containers.yml@master
    with:
      extra-packages: "pandas>=1.3.0 scikit-learn>=0.24.2 matplotlib"
      setup-script: |
        sed -i "s|path_to_stdlib|$GITHUB_WORKSPACE/biobb_dna/curvesplus/.curvesplus/standard|g" biobb_dna/test/conf.yml
        # Copying .cdi file for canion
        wget https://github.com/bioexcel/biobb_dna/releases/download/assets/THGA_K.cdi -O biobb_dna/test/data/curvesplus/THGA_K.cdi
